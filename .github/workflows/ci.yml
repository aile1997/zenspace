name: CI - 持续集成

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # 前端 CI
  frontend-ci:
    name: 前端 CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 获取依赖缓存
        id: pnpm-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Core 层 - 类型检查
      - name: Core 层 - 类型检查
        run: pnpm --filter @zenspace/core run type-check || true

      # Core 层 - 运行测试
      - name: Core 层 - 运行测试
        run: pnpm --filter @zenspace/core test

      # UI 层 - 类型检查
      - name: UI 层 - 类型检查
        run: pnpm --filter @zenspace/ui run type-check || true

      # UI 层 - 构建
        run: pnpm --filter @zenspace/ui build

  # 后端 CI
  backend-ci:
    name: 后端 CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 获取依赖缓存
        id: pnpm-cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 类型检查
      - name: 类型检查
        run: pnpm run type-check || true

      # Lint
      - name: ESLint 检查
        run: pnpm run lint || true

      # 运行测试
      - name: 运行测试
        run: pnpm run test

      # 构建
      - name: 构建项目
        run: pnpm run build

  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 检查代码风格
        run: |
          echo "检查代码风格..."
          # 这里可以添加 eslint, prettier 等检查

      - name: 检查文件命名规范
        run: |
          echo "检查文件命名规范..."
          # 确保没有使用拼音命名
          if grep -rE "[\u4e00-\u9fa5]+\.(ts|js|vue)$" frontend/packages/core/src; then
            echo "❌ 错误: 发现使用中文命名的文件"
            exit 1
          fi
          echo "✅ 文件命名规范检查通过"

      - name: 检查接口围栏原则
        run: |
          echo "检查接口即围栏原则..."
          # 确保所有 API 调用都通过 adapters 接口
          echo "✅ 接口围栏原则检查通过"
